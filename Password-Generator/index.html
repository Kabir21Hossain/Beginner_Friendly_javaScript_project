<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/src/output.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex justify-center items-center  ">
    
    <div class="w-[360px]  bg-slate-800  p-6 shadow-xl rounded-xl ">
        <h1 class="text-center text-2xl font-bold mb-4">Password Generator</h1>

        <div class="flex mb-3">
            <input id="password" type="text" class="bg-white text-black text-xl rounded-l px-3 py-2 flex-1  outline-none transition-all duration-300 ease-in-out" readonly>
            <button class="bg-green-600 px-3  rounded-r  font-bold hover:bg-green-600 hover:scale-103 " onclick="copyPassword()">Copy</button>
        </div>

        <div class="mb-4">
            <label >Password Length: <span id="lengthValue">12</span></label>
            <input id="length"  type="range" min="4" max="32" value="12" class="w-full" oninput="updateLength()" >
        </div>

        <div class=" flex flex-col space-y-2 mb-4 text-sm">
            <label class="flex gap-2"> <input  id="upper" type="checkbox" checked>Uppercase</label>
            <label class="flex gap-2" ><input id="lower" type="checkbox" checked>Lowercase</label>
            <label class="flex gap-2" > <input id="number" type="checkbox" checked>Numbers</label>
            <label class="flex gap-2" ><input id="symbol" type="checkbox" >Symbols</label>

        </div>
        

        <p class="text-m mb-3" id="strength">Strength:Medium</p>

        <button class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded text-lg" onclick="generatePassword()">Generate Password</button>

    </div>




    <script src="scripts.js"></script>
</body>
</html>
