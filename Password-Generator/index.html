<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="/src/output.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex justify-center items-center">

    <div class=" bg-slate-800 w-[360px]  rounded-xl shadow-xl p-6">
        <h1 class="text-center text-2xl font-bold mb-4 ">Password Generator</h1>

        <!-- input and copy button -->
        <div class="flex mb-3">
            <input id="password" type="text"  class="flex-1 px-4 py-2 bg-white outline-none rounded-l hover:scale-103 text-black" readonly>
            <button class="bg-green-600 px-4 rounded-r hover:scale-103 font-bold" onclick="copyPassword()">Copy</button>
        </div>

        <div class="mb-4">
            <p class="mb-2">Password Length: <span id="length">12</span></p>
            <input id="lengthVal" type="range" class="w-full" max="32" min="4" value="12" oninput="updateLength()">
        </div>

        <div class="flex flex-col space-y-2 mb-4">
            <label ><input type="checkbox"  id="upper" checked> Uppercase</label>
            <label ><input type="checkbox"  id="lower" checked> Lowercase</label>
            <label ><input type="checkbox"  id="number" checked> Numbers</label>
            <label ><input type="checkbox"  id="symbol"> Symbols</label>
        </div>

        <div class="space-y-2">
            <p id="strength">Strength:Medium</p>
            <button class="w-full bg-green-600 text-xl font-bold py-2 rounded-xl" onclick="generatePassword()">Generate Password</button>
        </div>
    </div>



<script src="scripts.js"></script>
</body>
</html>
