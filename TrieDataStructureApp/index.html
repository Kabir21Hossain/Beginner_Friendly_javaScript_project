<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trie Operations</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/src/output.css">
    
</head>
<body class="bg-gray-300 min-h-screen flex justify-center items-center ">

    <div class="w-full bg-white max-w-md p-8 rounded-lg shadow-lg" >
        <h1 class="text-center font-bold text-2xl mb-6">Trie Operations</h1>

        <div class="mb-4">
            <label for="wordInput" class="block mb-2 text-gray-600 font-semibold ">Enter Word/Prefix</label>
            <input id="wordInput" type="text" class="block w-full outline-none border rounded px-6 py-2 focus:outline-none focus:ring-indigo-600 hover:border-blue-800 hover:scale-101 shadow-sm  border-gray-300" placeholder="Enter a word">
        </div>

        <div class="grid grid-cols-2 gap-3 gap-x-5 mb-5">
            <button class="bg-blue-500 rounded text-white px-2 py-2 hover:bg-blue-600 hover:scale-101" onclick="insertWord()">Insert Word</button>
            <button class="bg-green-500 rounded text-white px-2 py-2 hover:bg-green-600 hover:scale-101" onclick="searchWord()">Search Word</button>
            <button class="bg-yellow-500 rounded text-white px-2 py-2 hover:bg-yellow-600 hover:scale-101" onclick="prefixSearch()">Prefix Search</button>
            <button class="bg-red-500 text-white rounded px-2 py-2 hover:bg-red-600 hover:scale-101" onclick="deleteWord()">Delete Word</button>
        </div>

        <button class="bg-purple-500 text-white w-full px-6 py-2 rounded hover:bg-purple-600 hover:scale-101 mb-4" onclick=" displayAllWords()">Display All Words</button>

        <p id="result" class="font-bold text-center text-lg mb-4 text-gray-800"></p>
        <ul id="wordList" class="mt-4 list-disc list-inside"></ul>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
