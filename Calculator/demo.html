<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scientific Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Math.js -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11.11.0/lib/browser/math.js"></script>
</head>

<body class="bg-gray-900 flex items-center justify-center min-h-screen text-white">

  <div class="bg-gray-800 p-4 rounded-xl w-80 shadow-lg">
    
    <!-- Display -->
    <div class="bg-black p-3 rounded mb-4 text-right">
      <div id="expression" class="text-sm text-gray-400"></div>
      <div id="result" class="text-2xl font-bold">0</div>
    </div>

    <!-- Buttons -->
    <div class="grid grid-cols-4 gap-2">

      <!-- Row 1 -->
      <button onclick="clearAll()" class="bg-red-600 p-2 rounded">C</button>
      <button onclick="append('(')" class="bg-gray-700 p-2 rounded">(</button>
      <button onclick="append(')')" class="bg-gray-700 p-2 rounded">)</button>
      <button onclick="append('/')" class="bg-yellow-500 p-2 rounded">÷</button>

      <!-- Row 2 -->
      <button onclick="append('7')" class="bg-gray-600 p-2 rounded">7</button>
      <button onclick="append('8')" class="bg-gray-600 p-2 rounded">8</button>
      <button onclick="append('9')" class="bg-gray-600 p-2 rounded">9</button>
      <button onclick="append('*')" class="bg-yellow-500 p-2 rounded">×</button>

      <!-- Row 3 -->
      <button onclick="append('4')" class="bg-gray-600 p-2 rounded">4</button>
      <button onclick="append('5')" class="bg-gray-600 p-2 rounded">5</button>
      <button onclick="append('6')" class="bg-gray-600 p-2 rounded">6</button>
      <button onclick="append('-')" class="bg-yellow-500 p-2 rounded">−</button>

      <!-- Row 4 -->
      <button onclick="append('1')" class="bg-gray-600 p-2 rounded">1</button>
      <button onclick="append('2')" class="bg-gray-600 p-2 rounded">2</button>
      <button onclick="append('3')" class="bg-gray-600 p-2 rounded">3</button>
      <button onclick="append('+')" class="bg-yellow-500 p-2 rounded">+</button>

      <!-- Row 5 -->
      <button onclick="append('0')" class="bg-gray-600 p-2 rounded col-span-2">0</button>
      <button onclick="append('.')" class="bg-gray-600 p-2 rounded">.</button>
      <button onclick="calculate()" class="bg-green-600 p-2 rounded">=</button>

      <!-- Scientific -->
      <button onclick="append('sin(')" class="bg-blue-600 p-2 rounded">sin</button>
      <button onclick="append('cos(')" class="bg-blue-600 p-2 rounded">cos</button>
      <button onclick="append('tan(')" class="bg-blue-600 p-2 rounded">tan</button>
      <button onclick="append('log10(')" class="bg-blue-600 p-2 rounded">log</button>

      <button onclick="append('sqrt(')" class="bg-purple-600 p-2 rounded">√</button>
      <button onclick="append('pi')" class="bg-purple-600 p-2 rounded">π</button>
      <button onclick="append('e')" class="bg-purple-600 p-2 rounded">e</button>
      <button onclick="append('^')" class="bg-purple-600 p-2 rounded">^</button>

    </div>
  </div>

  <!-- JavaScript -->
  <script>
    let expression = "";

    function append(value) {
      expression += value;
      document.getElementById("expression").innerText = expression;
    }

    function clearAll() {
      expression = "";
      document.getElementById("expression").innerText = "";
      document.getElementById("result").innerText = "0";
    }

    function calculate() {
      try {
        const result = math.evaluate(expression);
        document.getElementById("result").innerText = result;
      } catch (error) {
        document.getElementById("result").innerText = "Error";
      }
    }
  </script>

</body>
</html>
