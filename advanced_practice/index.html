<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock</title>

  <style>


  </style>
</head>

<body>
  <button onclick="addGlobalStyle()">Apply Global Style</button>
  <p>I will turn gold.</p>
  <p>I will also turn gold!</p>

  <style id="my-styles">
    /* This stylesheet starts empty or with basic styles */
    p {
      color: black;
    }
  </style>



  <script >

    function addGlobalStyle() {
  // 1. Get the stylesheet from the document
  // document.styleSheets returns an array-like list of all stylesheets
  const sheet = document.getElementById('my-styles').sheet;

  // 2. Use insertRule to add a new CSS declaration
  // Syntax: insertRule(ruleString, index)
  sheet.insertRule("p { color: gold; font-weight: bold; }", sheet.cssRules.length);
  
  console.log("New rule added to the stylesheet!");
}
  </script>
  <script src="scripts.js" type="module"></script>
</body>

</html>
