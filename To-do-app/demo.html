<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center">

  <div class="bg-slate-800 w-[360px] p-6 rounded-xl shadow-xl">

    <h1 class="text-2xl font-bold text-center mb-4">Todo App</h1>

    <!-- Input -->
    <div class="flex gap-2 mb-4">
      <input id="todoInput"
        type="text"
        placeholder="Enter task..."
        class="flex-1 px-3 py-2 rounded text-black" />
      <button id="addBtn"
        class="bg-green-600 hover:bg-green-500 px-4 rounded">
        Add
      </button>
    </div>

    <!-- List -->
    <ul id="todoList" class="space-y-2"></ul>

  </div>

<script>
  const input = document.getElementById("todoInput");
  const addBtn = document.getElementById("addBtn");
  const list = document.getElementById("todoList");

  let todos = JSON.parse(localStorage.getItem("todos")) || [];

  function saveTodos() {
    localStorage.setItem("todos", JSON.stringify(todos));
  }

  function renderTodos() {
    list.innerHTML = "";

    todos.forEach((todo, index) => {
      const li = document.createElement("li");
      

      li.innerHTML = `
        <span>${todo}</span>
        <button class="text-red-400 hover:text-red-300">✖</button>
      `;

      li.querySelector("button").onclick = () => {
        todos.splice(index, 1);
        saveTodos();
        renderTodos();
      };

      list.appendChild(li);
    });
  }

  addBtn.onclick = () => {
    const value = input.value.trim();
    if (!value) return;

    todos.push(value);
    saveTodos();
    renderTodos();
    input.value = "";
  };

  renderTodos();
</script>

</body>
</html>
