<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Advanced Todo App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center">

<div class="bg-slate-800 w-[380px] p-6 rounded-xl shadow-xl">

  <h1 class="text-2xl font-bold text-center mb-4">Todo App</h1>

  <!-- Input -->
  <div class="flex gap-2 mb-4">
    <input id="todoInput"
      type="text"
      placeholder="Enter task..."
      class="flex-1 px-3 py-2 rounded text-black outline-none">
    <button id="addBtn"
      class="bg-green-600 hover:bg-green-500 px-4 rounded">
      Add
    </button>
  </div>

  <!-- Filters -->
  <div class="flex justify-between mb-4 text-sm">
    <button onclick="setFilter('all')" class="hover:text-green-400">All</button>
    <button onclick="setFilter('active')" class="hover:text-green-400">Active</button>
    <button onclick="setFilter('done')" class="hover:text-green-400">Done</button>
  </div>

  <!-- Todo List -->
  <ul id="todoList" class="space-y-2"></ul>

</div>

<script>
  const input = document.getElementById("todoInput");
  const addBtn = document.getElementById("addBtn");
  const list = document.getElementById("todoList");

  let todos = JSON.parse(localStorage.getItem("todos")) || [];
  let filter = "all";

  function saveTodos() {
    localStorage.setItem("todos", JSON.stringify(todos));
  }

  function setFilter(type) {
    filter = type;
    renderTodos();
  }

  function renderTodos() {
    list.innerHTML = "";

    const filteredTodos = todos.filter(todo => {
      if (filter === "active") return !todo.completed;
      if (filter === "done") return todo.completed;
      return true;
    });

    filteredTodos.forEach((todo, index) => {
      const li = document.createElement("li");
      li.className =
        "flex items-center justify-between bg-slate-700 px-3 py-2 rounded";

      li.innerHTML = `
        <div class="flex items-center gap-2">
          <input type="checkbox" ${todo.completed ? "checked" : ""}>
          <span class="${todo.completed ? "line-through text-gray-400" : ""}">
            ${todo.text}
          </span>
        </div>
        <div class="flex gap-2">
          <button class="text-blue-400">✎</button>
          <button class="text-red-400">✖</button>
        </div>
      `;

      // Checkbox logic
      li.querySelector("input").onchange = () => {
        todo.completed = !todo.completed;
        saveTodos();
        renderTodos();
      };

      // Edit logic
      li.querySelector(".text-blue-400").onclick = () => {
        const newText = prompt("Edit task:", todo.text);
        if (newText) {
          todo.text = newText.trim();
          saveTodos();
          renderTodos();
        }
      };

      // Delete logic
      li.querySelector(".text-red-400").onclick = () => {
        todos.splice(index, 1);
        saveTodos();
        renderTodos();
      };

      list.appendChild(li);
    });
  }

  addBtn.onclick = () => {
    const value = input.value.trim();
    if (!value) return;

    todos.push({
      text: value,
      completed: false
    });

    saveTodos();
    renderTodos();
    input.value = "";
  };

  renderTodos();
</script>

</body>
</html>
