<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/src/output.css">
</head>
<body class="bg-slate-900 flex text-white min-h-screen justify-center items-center transition-all duration-0.4s ease-in-out">
    
    <div class="bg-slate-600 w-[360px] rounded-xl shadow-xl p-6 hover:scale-105 ">
        <h1 class="text-2xl text-center font-bold mb-4">Todo App</h1>

        <div class="flex justify-between gap-2 mb-4">
            <input id="todoInput" type="text"  placeholder="Enter Task" class="flex-1 px-3 py-3 bg-white text-black border-none outline-none rounded hover:scale-102">
            <button id="addBtn" class="bg-green-600 px-4 rounded text-xl hover:bg-green-500 hover:scale-105">Add</button>
        </div>

        <ul id="todoList"></ul>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
