<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter-App</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="/src/output.css">
</head>
<body>
  <div class="counter-box">
    <h1 id="count">0</h1>
    <button class="decrease button">Decrease</button>
    <button class="reset button">Reset</button>
    <button class="increase button">Increase</button>
    <button class="fiveIncrease  bg-blue-400 py-2 px-8 text-xl font-bold text-white rounded-md hover:scale-105 transition-all duration-300 ease-in-out m-2" >+5</button>
    <button class="fiveDecrease  bg-blue-400 py-2 px-8 text-xl font-bold text-white rounded-md hover:scale-105 transition-all duration-300 ease-in-out m-2" >-5</button>
  </div>



  <script src="./script.js"></script>
</body>
</html>
